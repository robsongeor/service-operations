name: Deploy Equipment Realtime Function

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy standalone realtime Function App
        uses: Azure/functions-action@v1
        with:
          app-name: serviceops-equipment-realtime-bbd3f9
          package: realtime-api
          publish-profile: ${{ secrets.AZURE_REALTIME_FUNCTIONAPP_PUBLISH_PROFILE }}
