name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - v1-deployment
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - v1-deployment

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    env:
      VITE_MSAL_CLIENT_ID: ${{ vars.VITE_MSAL_CLIENT_ID }}
      VITE_MSAL_TENANT_ID: ${{ vars.VITE_MSAL_TENANT_ID }}
      VITE_DATAVERSE_URL: ${{ vars.VITE_DATAVERSE_URL }}
      VITE_EQUIPMENT_REALTIME_API_URL: https://serviceops-equipment-realtime-bbd3f9.azurewebsites.net/api
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
          fetch-depth: 0
      - name: Determine application version
        shell: bash
        run: |
          EXACT_TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || true)
          SHORT_SHA=$(git rev-parse --short HEAD)

          if [ -n "$EXACT_TAG" ]; then
            VERSION="$EXACT_TAG"
            IS_RELEASE="true"
          else
            LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)

            if [ -n "$LATEST_TAG" ]; then
              VERSION="Unreleased · $SHORT_SHA"
            else
              VERSION="Development · $SHORT_SHA"
            fi

            IS_RELEASE="false"
          fi

          echo "VITE_APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "VITE_APP_VERSION_IS_RELEASE=$IS_RELEASE" >> "$GITHUB_ENV"
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_CLIFF_068680700 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: "/" # App source code path
          api_location: "api" # Managed Azure Functions API source
          output_location: "dist" # Built app content directory - optional
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_CLIFF_068680700 }}
          action: "close"
